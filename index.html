<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Add a meta tag to set the character set to utf-8. -->
    <meta charset="utf-8">
    <!-- Add a meta tag to initialize the viewport. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Add a meta tag to set the description to "SWDV-116 HTML Structure Lab" -->
    <meta name="description" content="SWDV-116 HTML Structure Lab">
    <!-- Add a meta tag to set the author to your name. -->
    <meta name="author" content="James Marion">

    <!-- Set the page title to "SWDV-116 HTML Structure Lab" -->
    <title>SWDV-116 HTML Structure Lab</title>

    <!-- Set the favicon url to https://zany.sh/favicon.svg?text=(your initials). For example: https://zany.sh/favicon.svg?text=TD -->
    <link rel="shortcut icon" href="https://zany.sh/favicon.svg?text=JM" type="image/x-icon">
</head>
<body>
    <!-- Add a semantic header element. -->
    <header>
        <!-- Inside the header, add a level 1 heading element that contains: (Your first name)'s Car Rentals. For example: Tom's Car Rentals. -->
        <h1>James's Car Rentals</h1>
    </header>
    <!-- Add a semantic navigation element. -->
    <nav>
        <!-- Inside the navigation element, add a link that contains "Semantic Elements" and opens to https://www.w3schools.com/html/html5_semantic_elements.asp in a new window/tab. -->
        <a href="https://www.w3schools.com/html/html5_semantic_elements.asp" target="_blank">Semantic Elements</a>
    </nav>
    <!-- Add a semantic main element. -->
    <main>
        <!-- Inside the main element, add a paragraph tag that contains "Rent A Car Today". -->
        <p>Rent A Car Today</p>
    </main>
    <!-- Add a semantic footer element. -->
    <footer>
        <!-- Inside the footer element, add a paragraph tag that contains the HTML copyright symbol followed by the current 4 digit year. -->
        <p>&copy;2026</p>
    </footer>
</body>
</html>
